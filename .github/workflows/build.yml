name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o "syncbeat (2).zip" -d . || unzip -o "syncbeat (1).zip" -d .

      - name: Generate Missing Debug Keystore & .env
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          touch .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncBeat-APK
          path: app/build/outputs/apk/debug/*.apk
