name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o "remix-syncbeat.zip" -d . || unzip -o "*.zip" -d .

      - name: Fix KSP & Gradle Configuration
        run: |
          # Generate missing debug keystore and .env
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          touch .env

          # Force JVM args and in-process KSP compilation to stop AWT crash
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.use.ksp2=false" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncBeat-APK
          path: app/build/outputs/apk/debug/*.apk
